# Configuración por defecto de AppHelm
# Esta configuración es adecuada para un entorno estándar

global:
  namespace: apphelm

# ===== FRONTEND =====
frontend:
  enabled: true
  replicaCount: 2
  
  image:
    repository: nginx
    tag: "1.25-alpine"
    pullPolicy: IfNotPresent
  
  service:
    type: ClusterIP
    port: 80
    targetPort: 80
  
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi

# ===== BACKEND =====
backend:
  enabled: true
  replicaCount: 2
  
  image:
    repository: node
    tag: "18-alpine"
    pullPolicy: IfNotPresent
  
  service:
    type: ClusterIP
    port: 3000
    targetPort: 3000
  
  env:
    - name: NODE_ENV
      value: "production"
    - name: DB_HOST
      value: "apphelm-database"
    - name: DB_PORT
      value: "5432"
  
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi

# ===== DATABASE =====
database:
  enabled: true
  replicaCount: 1
  
  image:
    repository: postgres
    tag: "15-alpine"
    pullPolicy: IfNotPresent
  
  service:
    type: ClusterIP
    port: 5432
    targetPort: 5432
  
  env:
    - name: POSTGRES_DB
      value: "apphelmdb"
    - name: POSTGRES_USER
      value: "dbuser"
    - name: POSTGRES_PASSWORD
      value: "dbpassword"
  
  persistence:
    enabled: true
    storageClass: ""
    accessMode: ReadWriteOnce
    size: 5Gi
    mountPath: /var/lib/postgresql/data
  
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi