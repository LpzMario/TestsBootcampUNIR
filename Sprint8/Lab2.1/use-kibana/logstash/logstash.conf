input {
  tcp {
    port => 5000
    codec => json
  }
}

filter {
  # Parsear el timestamp si viene en formato específico
  if [timestamp] {
    date {
      match => ["timestamp", "ISO8601"]
      target => "@timestamp"
    }
  }

  # Añadir información adicional
  mutate {
    add_field => { "application" => "use-kibana" }
  }
}

output {
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "spring-boot-logs-%{+YYYY.MM.dd}"
  }
  
  stdout {
    codec => rubydebug
  }
}