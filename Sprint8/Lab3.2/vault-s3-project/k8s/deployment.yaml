apiVersion: apps/v1
kind: Deployment
metadata:
  name: vault-s3-app
  namespace: vault-s3-demo
  labels:
    app: vault-s3-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vault-s3-app
  template:
    metadata:
      labels:
        app: vault-s3-app
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "vault-s3-app"
        vault.hashicorp.com/agent-inject-secret-aws-credentials: "secret/data/vault-s3-app/aws"
        vault.hashicorp.com/agent-inject-template-aws-credentials: |
          {{- with secret "secret/data/vault-s3-app/aws" -}}
          export AWS_ACCESS_KEY="{{ .Data.data.accessKey }}"
          export AWS_SECRET_KEY="{{ .Data.data.secretKey }}"
          {{- end }}
        vault.hashicorp.com/agent-inject-secret-application.yml: "secret/data/vault-s3-app/aws"
        vault.hashicorp.com/agent-inject-template-application.yml: |
          {{- with secret "secret/data/vault-s3-app/aws" -}}
          aws:
            credentials:
              access-key: {{ .Data.data.accessKey }}
              secret-key: {{ .Data.data.secretKey }}
          {{- end }}
    spec:
      serviceAccountName: vault-s3-app
      containers:
        - name: vault-s3-app
          image: vault-s3-app:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              protocol: TCP
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "kubernetes"
            - name: SPRING_CLOUD_VAULT_ENABLED
              value: "true"
            - name: SPRING_CLOUD_VAULT_URI
              value: "http://vault.default.svc.cluster.local:8200"
            - name: SPRING_CLOUD_VAULT_AUTHENTICATION
              value: "KUBERNETES"
            - name: SPRING_CLOUD_VAULT_KUBERNETES_ROLE
              value: "vault-s3-app"
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 5
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"