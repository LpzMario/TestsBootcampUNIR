server:
  port: 8080

spring:
  application:
    name: vault-s3-app
  cloud:
    vault:
      enabled: true
      uri: http://vault:8200
      authentication: KUBERNETES
      kubernetes:
        role: vault-s3-app
        kubernetes-path: kubernetes
        service-account-token-file: /var/run/secrets/kubernetes.io/serviceaccount/token
      kv:
        enabled: true
        backend: secret
        default-context: vault-s3-app
  config:
    import: vault://

# AWS S3 Configuration (los valores reales vienen de Vault)
aws:
  s3:
    bucket-name: ${AWS_S3_BUCKET_NAME:my-test-bucket}
    region: ${AWS_REGION:us-east-1}
  credentials:
    access-key: ${aws.accessKey:placeholder}
    secret-key: ${aws.secretKey:placeholder}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    com.example: DEBUG
    org.springframework.cloud.vault: DEBUG